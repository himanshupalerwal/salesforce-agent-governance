<template>
    <lightning-card class="ag-card" title="Agent health monitor" icon-name="standard:service_report">
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <span class="ag-meta slds-m-right_small last-updated">{lastUpdatedLabel}</span>
            <lightning-button
                label={refreshLabel}
                icon-name="utility:refresh"
                disabled={refreshing}
                onclick={handleRefresh}
            ></lightning-button>
        </div>
        <div class="slds-assistive-text announcement" aria-live="polite" aria-atomic="true">{announcement}</div>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={error}>
                <div
                    class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
                    role="alert"
                    aria-live="assertive"
                >
                    {error}
                </div>
            </template>

            <template lwc:if={isLoading}>
                <div class="slds-p-vertical_small loading-region" aria-busy="true">
                    <span class="ag-skeleton"></span>
                    <span class="ag-skeleton"></span>
                    <span class="ag-skeleton ag-skeleton_short"></span>
                    <span class="slds-assistive-text">Loading agent health</span>
                </div>
            </template>
            <template lwc:elseif={hasAgents}>
                <div class="ag-split ag-fade-in">
                    <template for:each={agents} for:item="agent">
                        <article key={agent.Id} class="slds-card ag-card agent-card">
                            <div class="slds-card__header slds-grid">
                                <div class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__figure">
                                        <lightning-icon
                                            icon-name={agent.breakerIcon}
                                            size="small"
                                            variant={agent.breakerVariant}
                                            alternative-text={agent.breakerAltText}
                                        ></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title slds-truncate">
                                            <a
                                                href={agent.agentUrl}
                                                data-record-id={agent.Id}
                                                onclick={handleRecordLink}
                                                >{agent.Agent_Name__c}</a
                                            >
                                        </h2>
                                        <p class="ag-meta">{agent.Agent_Type__c}</p>
                                    </div>
                                </div>
                                <span class={agent.statusPillClass}>{agent.statusLabel}</span>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                    <span class="ag-meta slds-m-right_x-small">Circuit breaker:</span>
                                    <span class={agent.breakerPillClass}>{agent.breakerLabel}</span>
                                </div>
                                <template lwc:if={agent.retryText}>
                                    <div class="ag-meta slds-m-bottom_x-small retry-time">{agent.retryText}</div>
                                </template>
                                <div class="slds-grid slds-m-bottom_x-small">
                                    <span class="ag-meta">Priority:</span>
                                    <span class="slds-text-body_small slds-m-left_xx-small">{agent.Priority__c}</span>
                                </div>
                                <div class="slds-m-bottom_x-small">
                                    <span class="ag-meta">Peak budget today: {agent.budgetPercent}%</span>
                                    <div
                                        class="ag-bar-track slds-m-top_xx-small"
                                        role="progressbar"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                        aria-valuenow={agent.budgetPercent}
                                        aria-label={agent.budgetAriaLabel}
                                    >
                                        <div class={agent.budgetBarClass} style={agent.budgetBarStyle}>
                                            <span class="slds-assistive-text">{agent.budgetPercent}%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="ag-meta">Last active: {agent.lastActiveFormatted}</div>
                                <template lwc:if={agent.hasFailures}>
                                    <div
                                        class="slds-text-body_small slds-text-color_error slds-m-top_xx-small failure-count"
                                    >
                                        Failures: {agent.Failure_Count__c}
                                    </div>
                                </template>
                            </div>
                        </article>
                    </template>
                </div>
            </template>
            <template lwc:else>
                <div class="ag-empty empty-state">
                    <span class="ag-empty__icon">
                        <lightning-icon icon-name="utility:people" size="small"></lightning-icon>
                    </span>
                    <p class="ag-empty__title">No agents registered</p>
                    <p class="ag-empty__text">Register agents to see health status.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
