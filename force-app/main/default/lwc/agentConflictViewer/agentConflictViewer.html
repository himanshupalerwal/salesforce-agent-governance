<template>
    <lightning-card title="Agent Conflicts" icon-name="standard:case">
        <span slot="actions">
            <lightning-badge label={conflictCount} class="slds-m-right_small"></lightning-badge>
            <lightning-button label="Refresh" icon-name="utility:refresh" onclick={handleRefresh}></lightning-button>
        </span>

        <template lwc:if={error}>
            <div class="slds-p-around_medium slds-text-color_error" role="alert" aria-live="assertive">{error}</div>
        </template>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative loading-region" aria-busy="true">
                <lightning-spinner alternative-text="Loading conflicts" size="medium"></lightning-spinner>
            </div>
        </template>
        <template lwc:else>
            <template lwc:if={hasConflicts}>
                <lightning-datatable
                    key-field="Id"
                    data={conflicts}
                    columns={columns}
                    hide-checkbox-column
                    show-row-number-column
                >
                </lightning-datatable>
            </template>
            <template lwc:else>
                <div class="slds-text-align_center slds-text-color_weak slds-p-around_large empty-state">
                    No conflicts detected. All agents are operating without contention.
                </div>
            </template>
        </template>
    </lightning-card>
</template>
