<template>
    <div class="slds-page-header slds-m-bottom_medium">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:bot"
                            size="large"
                            alternative-text="AgentGov"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title">AgentGov dashboard</h1>
                        <p class="ag-meta">AI agent governance overview</p>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__col-actions">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <span class={liveUpdatesClass} aria-live="polite">{liveUpdatesLabel}</span>
                    <span class="ag-meta slds-m-right_small last-updated">{lastUpdatedLabel}</span>
                    <lightning-button
                        label={refreshLabel}
                        icon-name="utility:refresh"
                        disabled={refreshing}
                        onclick={handleRefresh}
                    ></lightning-button>
                </div>
                <span class="slds-assistive-text announcement" aria-live="polite" aria-atomic="true"
                    >{announcement}</span
                >
            </div>
        </div>
    </div>

    <template lwc:if={error}>
        <div
            class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium"
            role="alert"
            aria-live="assertive"
        >
            <span class="slds-assistive-text">Error</span>
            <h2>{error}</h2>
        </div>
    </template>

    <template lwc:if={isLoading}>
        <div aria-busy="true">
            <div class="ag-kpi-grid">
                <span class="ag-skeleton ag-skeleton_tile"></span>
                <span class="ag-skeleton ag-skeleton_tile"></span>
                <span class="ag-skeleton ag-skeleton_tile"></span>
                <span class="ag-skeleton ag-skeleton_tile"></span>
                <span class="ag-skeleton ag-skeleton_tile"></span>
                <span class="ag-skeleton ag-skeleton_tile"></span>
            </div>
            <div class="slds-card ag-card">
                <div class="slds-card__body slds-card__body_inner slds-p-vertical_medium">
                    <span class="ag-skeleton ag-skeleton_title"></span>
                    <span class="ag-skeleton"></span>
                    <span class="ag-skeleton ag-skeleton_short"></span>
                </div>
            </div>
            <span class="slds-assistive-text">Loading dashboard</span>
        </div>
    </template>
    <template lwc:else>
        <div class="ag-fade-in">
            <dl class="ag-kpi-grid kpi-grid">
                <template for:each={kpis} for:item="kpi">
                    <div key={kpi.key} class={kpi.tileClass} data-key={kpi.key}>
                        <dt class="ag-kpi__head kpi-label">
                            <lightning-icon
                                icon-name={kpi.icon}
                                size="x-small"
                                variant={kpi.iconVariant}
                            ></lightning-icon>
                            <span>{kpi.label}</span>
                        </dt>
                        <dd class="ag-kpi__value kpi-value">{kpi.value}</dd>
                    </div>
                </template>
            </dl>

            <lightning-card class="ag-card" title="Governor budget usage" icon-name="standard:dashboard">
                <div class="slds-p-around_medium">
                    <template lwc:if={hasBudgets}>
                        <p class="ag-meta slds-m-bottom_small">
                            Each bar is the agent's most-used limit as a share of its daily allocation, the figure its
                            budget status is decided on.
                        </p>
                        <template for:each={budgets} for:item="budget">
                            <div key={budget.Id} class="slds-m-bottom_small budget-row">
                                <div
                                    class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small"
                                >
                                    <a
                                        class="slds-text-body_regular"
                                        href={budget.agentUrl}
                                        data-record-id={budget.Agent_Registration__c}
                                        onclick={handleRecordLink}
                                        >{budget.agentName}</a
                                    >
                                    <span class={budget.statusPillClass}>{budget.Budget_Status__c}</span>
                                </div>
                                <div
                                    class="ag-bar-track"
                                    role="progressbar"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                    aria-valuenow={budget.peakPercent}
                                    aria-label={budget.ariaLabel}
                                >
                                    <div class={budget.barClass} style={budget.barStyle}>
                                        <span class="slds-assistive-text">{budget.peakPercent}%</span>
                                    </div>
                                </div>
                                <div class="slds-grid ag-meta slds-m-top_xx-small">
                                    <span class="slds-col">API: {budget.apiPercent}%</span>
                                    <span class="slds-col">SOQL: {budget.soqlPercent}%</span>
                                    <span class="slds-col">DML: {budget.dmlPercent}%</span>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template lwc:else>
                        <div class="ag-empty empty-state">
                            <span class="ag-empty__icon">
                                <lightning-icon icon-name="utility:chart" size="small"></lightning-icon>
                            </span>
                            <p class="ag-empty__title">No usage yet today</p>
                            <p class="ag-empty__text">No budget data available for today.</p>
                        </div>
                    </template>
                </div>
            </lightning-card>

            <lightning-card class="ag-card slds-m-top_medium" title="Active sessions" icon-name="standard:live_chat">
                <div class="slds-p-around_medium">
                    <template lwc:if={hasSessions}>
                        <div class="slds-scrollable_x">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <caption class="slds-assistive-text">
                                    Active agent sessions and their resource usage
                                </caption>
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">Agent</div></th>
                                        <th scope="col"><div class="slds-truncate">Started</div></th>
                                        <th scope="col"><div class="slds-truncate">Last activity</div></th>
                                        <th scope="col" class="ag-num"><div class="slds-truncate">API calls</div></th>
                                        <th scope="col" class="ag-num">
                                            <div class="slds-truncate">SOQL queries</div>
                                        </th>
                                        <th scope="col" class="ag-num"><div class="slds-truncate">DML ops</div></th>
                                        <th scope="col" class="ag-num"><div class="slds-truncate">Actions</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={sessions} for:item="session">
                                        <tr key={session.Id}>
                                            <th scope="row">
                                                <a
                                                    href={session.agentUrl}
                                                    data-record-id={session.Agent_Registration__c}
                                                    onclick={handleRecordLink}
                                                    >{session.agentName}</a
                                                >
                                            </th>
                                            <td><div class="slds-truncate">{session.formattedStart}</div></td>
                                            <td><div class="slds-truncate">{session.formattedLastActivity}</div></td>
                                            <td class="ag-num">{session.apiCalls}</td>
                                            <td class="ag-num">{session.soqlQueries}</td>
                                            <td class="ag-num">{session.dmlStatements}</td>
                                            <td class="ag-num">{session.actions}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="ag-empty empty-state">
                            <span class="ag-empty__icon">
                                <lightning-icon icon-name="utility:clock" size="small"></lightning-icon>
                            </span>
                            <p class="ag-empty__title">No live sessions</p>
                            <p class="ag-empty__text">No agent has a live session right now.</p>
                        </div>
                    </template>
                </div>
            </lightning-card>

            <lightning-card class="ag-card slds-m-top_medium" title="Recent conflicts" icon-name="standard:case">
                <div class="slds-p-around_medium">
                    <template lwc:if={hasConflicts}>
                        <div class="slds-scrollable_x">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <caption class="slds-assistive-text">
                                    Recent conflicts between agents
                                </caption>
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">Time</div></th>
                                        <th scope="col"><div class="slds-truncate">Agent 1</div></th>
                                        <th scope="col"><div class="slds-truncate">Agent 2</div></th>
                                        <th scope="col"><div class="slds-truncate">Object</div></th>
                                        <th scope="col"><div class="slds-truncate">Type</div></th>
                                        <th scope="col"><div class="slds-truncate">Resolution</div></th>
                                        <th scope="col"><div class="slds-truncate">Severity</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={conflicts} for:item="conflict">
                                        <tr key={conflict.Id}>
                                            <td><div class="slds-truncate">{conflict.formattedTime}</div></td>
                                            <td>
                                                <a
                                                    href={conflict.agent1Url}
                                                    data-record-id={conflict.Agent_1__c}
                                                    onclick={handleRecordLink}
                                                    >{conflict.agent1Name}</a
                                                >
                                            </td>
                                            <td>
                                                <a
                                                    href={conflict.agent2Url}
                                                    data-record-id={conflict.Agent_2__c}
                                                    onclick={handleRecordLink}
                                                    >{conflict.agent2Name}</a
                                                >
                                            </td>
                                            <td><div class="slds-truncate">{conflict.Object_Name__c}</div></td>
                                            <td><div class="slds-truncate">{conflict.Conflict_Type__c}</div></td>
                                            <td><div class="slds-truncate">{conflict.Resolution__c}</div></td>
                                            <td>
                                                <span class={conflict.severityPillClass}>{conflict.Severity__c}</span>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="ag-empty empty-state">
                            <span class="ag-empty__icon">
                                <lightning-icon
                                    icon-name="utility:success"
                                    variant="success"
                                    size="small"
                                ></lightning-icon>
                            </span>
                            <p class="ag-empty__title">All clear</p>
                            <p class="ag-empty__text">No conflicts detected.</p>
                        </div>
                    </template>
                </div>
            </lightning-card>
        </div>
    </template>
</template>
