# Salesforce Code Analyzer v5 configuration.
#
# Run locally with:  sf code-analyzer run --workspace force-app --config-file code-analyzer.yml
# CI runs the same command through the forcedotcom/run-code-analyzer action.
#
# Severity scale: 1 Critical, 2 High, 3 Moderate, 4 Low, 5 Info. CI fails on
# any violation at Moderate or above. The rules below are elevated because the
# framework executes SOQL and DML on behalf of AI agents, so injection, CRUD/FLS,
# and sharing findings are treated as defects rather than advisories.

rules:
  pmd:
    ApexSOQLInjection:
      severity: 1
    ApexCRUDViolation:
      severity: 2
    ApexSharingViolations:
      severity: 2
    ApexInsecureEndpoint:
      severity: 2
    ApexOpenRedirect:
      severity: 2
    ApexSuggestUsingNamedCred:
      severity: 3

engines:
  eslint:
    # Use the repository's flat config so the analyzer and `npm run lint` agree.
    eslint_config_file: eslint.config.js
    auto_discover_eslint_config: false
  sfge:
    # The graph engine needs a JDK and long runtimes; PMD and ESLint cover the
    # rules this project relies on.
    disable_engine: true
  flow:
    # The project ships no Flow metadata, and the engine needs a Python runtime.
    disable_engine: true
