# Publishes a GitHub Release whenever a version tag (v1.2.0, v1.3.0, ...) is pushed.
#
# The tag must match the version in package.json, which keeps the npm metadata,
# the CHANGELOG, and the published release in step. The release body is the
# matching CHANGELOG section, followed by GitHub's generated notes, and the
# attached archive contains the deployable metadata for orgs that install from
# a download rather than from source control.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Extract the CHANGELOG section for this version
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { printing = index($0, "[" ver "]") > 0; next }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for version ${GITHUB_REF_NAME#v}."
            exit 1
          fi

      - name: Build the deployable archive
        run: >
          zip -r "agentgov-${GITHUB_REF_NAME}.zip"
          force-app sfdx-project.json config scripts LICENSE README.md CHANGELOG.md docs
          -x "*/__tests__/*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: agentgov-${{ github.ref_name }}.zip
