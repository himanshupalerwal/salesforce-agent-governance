# Keeps the npm toolchain and the GitHub Actions used by CI current.
# Minor and patch updates are grouped into one pull request per ecosystem to
# keep review noise low; major updates arrive individually.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
